const byState = {};
raw.forEach(u => {
  if (!byState[u.state]) byState[u.state] = [];
  byState[u.state].push(u);
});

let globalSno = 1;
let html = '';

Object.keys(byState).forEach(state => {
  const unis = byState[state];
  html += `<div class="state-block">
    <div class="state-header">
      <i class="ti ti-map-pin" aria-hidden="true"></i>
      ${state}
      <span class="badge">${unis.length} universities</span>
    </div>
    <table>
      <thead><tr>
        <th>S.No</th>
        <th>University</th>
        <th>City</th>
        <th>Type</th>
        <th class="note">Old ID</th>
      </tr></thead>
      <tbody>`;

  unis.forEach(u => {
    html += `<tr>
      <td class="sno">${globalSno++}</td>
      <td><span class="name">${u.name}</span></td>
      <td style="color:var(--color-text-secondary)">${u.city}</td>
      <td><span class="type-badge ${typeClass(u.type)}">${u.type}</span></td>
      <td class="old-id">${u.oldId}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
});

document.getElementById('content').innerHTML = html;
</script>
